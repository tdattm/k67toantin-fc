  <text x="701" y="153" fill="#f0fdf4" font-family="Arial,sans-serif" font-size="17" font-weight="700">Bạn có link đội cũ?</text>
  <text x="646" y="202" fill="#a7cbb8" font-family="Arial,sans-serif" font-size="14">Mở link đã được chia sẻ để</text>
  <text x="646" y="224" fill="#a7cbb8" font-family="Arial,sans-serif" font-size="14">tiếp tục xem lịch và đội hình.</text>
  <text x="646" y="246" fill="#a7cbb8" font-family="Arial,sans-serif" font-size="14">Không cần tạo tài khoản.</text>
